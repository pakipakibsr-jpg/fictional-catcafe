<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="robots" content="noindex,nofollow">
        <title>お問い合わせフォーム</title>
        <link rel="stylesheet" href="./nekoHP.css">
        <link rel="stylesheet" href="./nekoform.css">
        <!-- favicon -->
    <link rel="shortcut icon" href="./images/長毛種猫2026-07-28 141146.png">
    </head>
    <body>
      <header>
      <h1 id="logo"><img src="./images/スクリーンショット 2026-07-24 154748.png" alt="ひまわりねこ" width="60px">猫カフェYUSAへようこそ！</h1>
      </header>
      <nav id="menubar">
       <ul>
        <li><a href="./index.html">猫カフェYUSAについて</a></li>
        <li><a href="./nekocast.html">ねこキャスト紹介</a></li>
        <li><a href="./nekocash.html">利用料金</a></li>
        <li><a href="./nekogallery.html">フォトギャラリー</a></li>
        <li class="current"><a href="./nekoform.html">お問い合わせ/SNS</a></li>
       </ul>
      </nav>
      <div class="contact-area">
        <div class="Form">
  <div class="Form-Item">
    <p class="Form-Item-Label">
      <span class="Form-Item-Label-Required">必須</span>会社名
    </p>
    <input type="text" class="Form-Item-Input" placeholder="例）株式会社にゃんこ">
  </div>
  <div class="Form-Item">
    <p class="Form-Item-Label"><span class="Form-Item-Label-Required">必須</span>氏名</p>
    <input type="text" class="Form-Item-Input" placeholder="例）猫田にゃん助">
  </div>
  <div class="Form-Item">
    <p class="Form-Item-Label"><span class="Form-Item-Label-Required">必須</span>電話番号</p>
    <input type="text" class="Form-Item-Input" placeholder="例）000-0000-0000">
  </div>
  <div class="Form-Item">
    <p class="Form-Item-Label"><span class="Form-Item-Label-Required">必須</span>メールアドレス</p>
    <input type="email" class="Form-Item-Input" placeholder="例）example@gmail.com">
  </div>
  <div class="Form-Item">
    <p class="Form-Item-Label isMsg"><span class="Form-Item-Label-Required">必須</span>お問い合わせ内容</p>
    <textarea class="Form-Item-Textarea"></textarea>
  </div>
    <input type="submit" class="Form-Btn" value="送信する">
   </div>
   <div class="side-area">
   <a href="https://www.instagram.com/ratemaro_diary/" target="_blank" id="instagram">
  <img src="./images/インスタと猫さんのアプリアイコン.jpg" alt="Instagram" width="100px"></a>
<p><a href="#" class="page-top"><img src="./images/クッションで眠る猫さん.jpg" alt="寝ねこ" width="100px"></a></p>
</div>
</div>
    </body>
</html>
