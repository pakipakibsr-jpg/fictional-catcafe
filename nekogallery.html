<style>
.fade-slideshow {
  width: 900px;
  height: 600px;
  position: relative;
  overflow: hidden;
  margin: 0 auto;
}

.fade-slide {
  width: 100%;
  height: 100%;
  object-fit: cover;

  position: absolute;
  top: 0;
  left: 0;

  opacity: 0;
  transition: opacity 1.5s ease;
}

.fade-slide.show {
  opacity: 1;
}
</style>

<script>
const fadeSlides = document.querySelectorAll(".fade-slide");
let fadeIndex = 0;

function fadeChange() {
  fadeSlides.forEach(slide => {
    slide.classList.remove("show");
  });

  fadeSlides[fadeIndex].classList.add("show");

  fadeIndex++;
  if (fadeIndex >= fadeSlides.length) {
    fadeIndex = 0;
  }
}

fadeChange();              // 最初の画像を表示
setInterval(fadeChange, 4000); // 4秒ごとに切替
</script>
